name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Test (pytest)
        run: pytest

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test (vitest)
        run: npm test
      - name: Build (vite)
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t voicepilot-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t voicepilot-frontend:ci ./frontend

  compose:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start compose stack
        run: docker compose up -d --build
      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8010/api/health >/dev/null; then
              echo "backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "backend health check failed"
          docker compose logs backend
          exit 1
      - name: Wait for frontend proxy health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5174/api/health >/dev/null; then
              echo "frontend proxy healthy"
              exit 0
            fi
            sleep 2
          done
          echo "frontend health check failed"
          docker compose logs frontend
          exit 1
      - name: Show stack logs
        if: always()
        run: docker compose logs --tail 50
      - name: Tear down
        if: always()
        run: docker compose down --volumes
